server {
    server_name redfoxmi.com www.redfoxmi.com;

    root /opt/red-fox-market-dynamics/site;
    index index.html;

    # Board payloads are data-heavy; compress CSV/JSON before transit without
    # weakening the no-store policy applied to protected endpoints below.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript;

    # The homepage is public. Paid board content is handled below.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nginx asks this internal endpoint whether the signed-in user has an
    # active subscription before it serves board content or source data.
    location = /_internal/board-access {
        internal;
        proxy_pass http://127.0.0.1:5051/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /board.html {
        auth_request /_internal/board-access;
        error_page 401 = /index.html?auth=required;
        try_files $uri =404;
    }

    # Every file consumed by the board is protected too, preventing data
    # downloads from bypassing the board route.
    location ~ ^/data/(dashboard\.csv|results_resolved\.csv|signal_ledger\.csv|snapshots\.csv|score_history\.csv|kpi_master_dataset\.csv|anomaly_board\.csv|anomaly_events\.csv|anomaly_action_ledger\.csv|decision_freeze_ledger\.csv|freshness\.json|book_lines\.json|live_recent\.csv)$ {
        auth_request /_internal/board-access;
        error_page 401 = /index.html?payment=required;
        alias /opt/red-fox-market-dynamics/data/$1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Small, game-scoped timelines keep the first detail click fast on mobile
    # without exposing the broader working data directory.
    location ~ ^/data/anomaly_event_details/(?<event_detail>[A-Za-z0-9._%+-]+\.json)$ {
        auth_request /_internal/board-access;
        error_page 401 = /index.html?payment=required;
        alias /opt/red-fox-market-dynamics/data/anomaly_event_details/$event_detail;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Nothing else in the working data directory is public.
    location /data/ {
        deny all;
        return 403;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/redfoxmi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/redfoxmi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.redfoxmi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = redfoxmi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name redfoxmi.com www.redfoxmi.com;
    return 404; # managed by Certbot
}
