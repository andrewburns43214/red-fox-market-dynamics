location ^~ /data/anomaly_event_details/ {
    auth_request /_internal/board-access;
    root /opt/red-fox-market-dynamics;
    try_files $uri @redfox_archived_detail;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    types { application/json json; }
}

location @redfox_archived_detail {
    auth_request /_internal/board-access;
    root /var/lib/redfox-history/public;
    gzip_static always;
    gunzip on;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    types { application/json json; }
}
