location ^~ /data/historical_comparisons/ {
    if ($uri !~ "^/data/historical_comparisons/(index\.json|[a-z]+--[A-Za-z0-9_-]{1,75}\.json)$") {
        return 404;
    }
    auth_request /_internal/board-access;
    alias /var/lib/redfox-history/public/comparisons/;
    limit_except GET { deny all; }
    types { application/json json; }
    gzip_static always;
    gunzip on;
    gzip_vary on;
    add_header Cache-Control "private, no-store" always;
}
