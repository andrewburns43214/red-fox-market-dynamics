location ^~ /data/team-intelligence/ {
    if ($uri !~ "^/data/team-intelligence/(nfl|ncaaf|nba|ncaab|mlb|nhl|ufc)\.json$") {
        return 404;
    }
    auth_request /_internal/board-access;
    alias /var/lib/redfox-team-intelligence/public/;
    limit_except GET { deny all; }
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    gzip_vary on;
    add_header Cache-Control "private, max-age=120";
}
