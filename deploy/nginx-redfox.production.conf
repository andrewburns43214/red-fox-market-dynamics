server {
    server_name redfoxmi.com www.redfoxmi.com;

    # Serve the single-page dashboard
    root /opt/red-fox-market-dynamics/site;
    index index.html;

    # Sandbox routes are local-only tooling.  Block them explicitly before the
    # SPA fallback can turn an unknown path into a successful public response.
    location = /board-sandbox.html { return 404; }
    location ^~ /sandbox-data/ { return 404; }
    location = /.sandbox-response.html { return 404; }

    location = /_internal/board-access {
        internal;
        proxy_pass http://127.0.0.1:5051/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /board.html {
        auth_request /_internal/board-access;
        error_page 401 = /index.html?auth=required;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Allowlisted CSV files the UI needs ──
    location = /data/dashboard.csv {
        auth_request /_internal/board-access;
        alias /opt/red-fox-market-dynamics/data/dashboard.csv;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { text/csv csv; }
    }
    location = /data/results_resolved.csv {
        auth_request /_internal/board-access;
        alias /opt/red-fox-market-dynamics/data/results_resolved.csv;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { text/csv csv; }
    }
    location = /data/signal_ledger.csv {
        auth_request /_internal/board-access;
        alias /opt/red-fox-market-dynamics/data/signal_ledger.csv;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { text/csv csv; }
    }
location = /data/freshness.json {        auth_request /_internal/board-access;        alias /opt/red-fox-market-dynamics/data/freshness.json;        add_header Access-Control-Allow-Origin *;        add_header Cache-Control "no-cache, no-store, must-revalidate";        types { application/json json; }    }
    location = /data/book_lines.json {
        auth_request /_internal/board-access;
        alias /opt/red-fox-market-dynamics/data/book_lines.json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { application/json json; }
    }
    location = /data/snapshots.csv {
        auth_request /_internal/board-access;
        alias /opt/red-fox-market-dynamics/data/snapshots.csv;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { text/csv csv; }
    }
location = /data/score_history.csv {        auth_request /_internal/board-access;        alias /opt/red-fox-market-dynamics/data/score_history.csv;        add_header Access-Control-Allow-Origin *;        add_header Cache-Control "no-cache, no-store, must-revalidate";        types { text/csv csv; }    }
    location = /data/kpi_master_dataset.csv {
        auth_request /_internal/board-access;
        alias /opt/red-fox-market-dynamics/data/kpi_master_dataset.csv;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { text/csv csv; }
    }
    location = /data/live_recent.csv {
        auth_request /_internal/board-access;
        alias /opt/red-fox-market-dynamics/data/live_recent.csv;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { text/csv csv; }
    }

    include /etc/nginx/redfox-board-locations.conf;
    # ── Block everything else under /data/ ──
    location ^~ /data/ {
        deny all;
        return 403;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/redfoxmi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/redfoxmi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.redfoxmi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = redfoxmi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name redfoxmi.com www.redfoxmi.com;
    return 404; # managed by Certbot




}
