location = /data/anomaly_board.csv {
    auth_request /_internal/board-access;
    alias /opt/red-fox-market-dynamics/data/anomaly_board.csv;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location = /data/anomaly_events.csv {
    auth_request /_internal/board-access;
    alias /opt/red-fox-market-dynamics/data/anomaly_events.csv;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

location ^~ /data/anomaly_event_details/ {
    auth_request /_internal/board-access;
    alias /opt/red-fox-market-dynamics/data/anomaly_event_details/;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    types { application/json json; }
}
