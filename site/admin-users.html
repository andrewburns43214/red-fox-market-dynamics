<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users | Red Fox Admin</title><link rel="stylesheet" href="/legal.css"><style>main{max-width:1180px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select,.toolbar button{font:inherit;padding:9px 11px;border:1px solid #cbd5dc;border-radius:7px}.toolbar button{background:#c0392b;color:#fff;border:0;font-weight:700}.table-wrap{overflow:auto;background:#fff;border:1px solid #dce3e6;border-radius:10px}.users{width:100%;border-collapse:collapse;font-size:13px}.users th,.users td{padding:10px;text-align:left;border-bottom:1px solid #edf0f2;white-space:nowrap}.users th{background:#f7f8f8}.status{margin:16px 0;color:#40505c}.pager{display:flex;gap:8px;align-items:center;margin-top:14px}.pager button{padding:8px 12px}</style></head><body><nav class="legal-nav"><a class="brand" href="/">Red Fox <small>Market Intelligence</small></a><a class="back" href="/board.html">Back to board</a></nav><main><h1>Customer Directory</h1><p class="updated">Admin only</p><div class="toolbar"><input id="search" placeholder="Search name or email" autocomplete="off"><select id="filter"><option value="all">All</option><option value="active">Active Access</option><option value="trial_active">Free Trial Active</option><option value="trial_expired">Free Trial Expired</option><option value="monthly">Monthly</option><option value="annual">Annual</option><option value="granted">Granted</option><option value="bypass">Owner/Guest Bypass</option><option value="payment_issue">Payment Issue</option><option value="no_access">Expired / No Access</option></select><button id="apply">Search</button></div><p class="status" id="status">Checking access…</p><div class="table-wrap" hidden id="results"><table class="users"><thead><tr><th>Name</th><th>Email</th><th>Signup</th><th>Last login</th><th>Access</th><th>Active</th><th>Free Trial ends</th><th>Plan / status</th><th>Paid through</th><th>Grant</th><th>Bypass</th><th>Stripe customer</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager" id="pager" hidden><button id="previous">Previous</button><button id="next">Next</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script>const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),limit=50;let offset=0,lastCount=0;const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=v=>v?new Date(v).toLocaleString():'—';const accessLabel=v=>v==='Free Day'?'Free Trial':v;async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){location.replace('/');return}const r=await fetch(SUPABASE_URL+'/functions/v1/admin-users',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({search:$('search').value,filter:$('filter').value,limit,offset})});if(r.status===401||r.status===403){$('status').textContent='You do not have access to this page.';$('results').hidden=true;return}const d=await r.json();if(!r.ok){$('status').textContent='Unable to load customers.';return}lastCount=d.users.length;$('status').textContent=lastCount+' customer'+(lastCount===1?'':'s')+' shown';$('rows').innerHTML=d.users.map(u=>'<tr><td>'+esc([u.first_name,u.last_name].filter(Boolean).join(' ')||'Legacy user')+'</td><td>'+esc(u.email)+'</td><td>'+time(u.signup_date)+'</td><td>'+time(u.last_login)+'</td><td>'+esc(accessLabel(u.access_type))+'</td><td>'+((u.access_active)?'Yes':'No')+'</td><td>'+time(u.trial_ends)+'</td><td>'+esc([u.plan,u.subscription_status].filter(Boolean).join(' / '))+'</td><td>'+time(u.paid_through)+'</td><td>'+((u.granted)?'Yes':'No')+'</td><td>'+((u.owner_guest_bypass)?'Yes':'No')+'</td><td>'+esc(u.stripe_customer_id)+'</td></tr>').join('');$('results').hidden=false;$('pager').hidden=false;$('previous').disabled=offset===0;$('next').disabled=lastCount<limit}$('apply').onclick=()=>{offset=0;load()};$('previous').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{if(lastCount===limit){offset+=limit;load()}};load();</script></body></html>
