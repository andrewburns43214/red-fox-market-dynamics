<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support | Red Fox</title><link rel="stylesheet" href="/legal.css"><style>.support-form{display:grid;gap:15px}.support-form label{font-weight:700;font-size:13px;color:#40505c}.support-form input,.support-form select,.support-form textarea{width:100%;margin-top:5px;padding:10px 12px;border:1px solid #cbd5dc;border-radius:7px;font:15px inherit}.support-form textarea{min-height:150px;resize:vertical}.support-form button{padding:11px 16px;border:0;border-radius:7px;background:#c0392b;color:#fff;font-weight:800;cursor:pointer}.honeypot{position:absolute;left:-10000px}.result{margin:0;color:#0f5f73;font-size:14px}</style></head><body><nav class="legal-nav"><a class="brand" href="/">Red Fox <small>Market Intelligence</small></a><a class="back" href="/">Back to site</a></nav><main><h1>Support Center</h1><p class="updated">Account, billing, cancellation, or policy questions</p><div class="card"><p>Use this form for help with your Red Fox account. Do not include passwords, full payment card numbers, or sensitive personal information.</p><form class="support-form" id="support-form"><label>Name<input name="name" required maxlength="100"></label><label>Email used for your account<input name="email" type="email" required maxlength="254"></label><label>Topic<select name="category"><option>Account access</option><option>Billing or cancellation</option><option>Refund request</option><option>Technical issue</option><option>Other</option></select></label><label>How can we help?<textarea name="message" required maxlength="4000"></textarea></label><label class="honeypot">Website<input name="website" tabindex="-1" autocomplete="off"></label><button type="submit">Send support request</button><p class="result" id="support-result" aria-live="polite"></p></form></div></main><footer class="legal-footer"><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a><a href="/refund-policy.html">Refunds</a><a href="/support.html">Support</a></footer><script src="/config.js"></script><script>document.getElementById('support-form').addEventListener('submit',async function(event){event.preventDefault();const result=document.getElementById('support-result');result.textContent='Sending...';const form=new FormData(event.currentTarget);const payload=Object.fromEntries(form.entries());try{const response=await fetch(SUPABASE_URL+'/functions/v1/send-support-message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw new Error(data.error);event.currentTarget.reset();result.textContent='Your request was sent. We will reply to the email you provided.';}catch(error){result.textContent=error.message||'Unable to send your request right now.';}});</script></body></html>
